name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

# A newer push to the same branch/PR supersedes a running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Check copyright headers
      run: |
        FILES=$(find . -type d \( -path "./.lake" \) -prune -o -type f -name "*.lean" -exec perl -ne 'BEGIN { $/ = undef; } print "$ARGV\n" if !m{\A/-\nCopyright}; exit;' {} \;)
        if [ -n "$FILES" ]; then
          echo "Found .lean files which do not have a copyright header:"
          echo "$FILES"
          exit 1
        fi

    - uses: leanprover/lean-action@v1
      with:
        auto-config: false
        use-mathlib-cache: false
        use-github-cache: true

    # The AWS-LC objects parsed by the ELFParser tests depend only on the pinned
    # AWS-LC version and the build scripts, so cache them across runs.
    - name: Restore AWS-LC build
      id: awslc-cache
      uses: actions/cache@v6
      with:
        path: Tests/ELFParser/Data/aws-lc-build
        key: awslc-${{ hashFiles('scripts/build_awslc.sh', 'scripts/build_awslc.cmake', 'scripts/Dockerfile') }}

    - name: Build AWS-LC
      if: steps.awslc-cache.outputs.cache-hit != 'true'
      run: ./scripts/ci_ubuntu_build_awslc.sh

    - name: Build specs, correctness, proofs and tests
      run: make specs correctness proofs tests

    - name: AWS-LC ELF tests
      run: lake build AWSLCELFTests

    # `Doc` imports `Main`, the root of the `lnsym` executable (not part of any
    # library), so build the executable first.
    - name: Build the lnsym executable and the docs module
      run: |
        lake build lnsym
        lake build Doc

  cosim:
    name: Cosimulation (macOS, aarch64)
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v7

    - uses: leanprover/lean-action@v1
      with:
        auto-config: false
        use-mathlib-cache: false
        use-github-cache: true

    - name: Run cosimulation
      run: make cosim NUM_TESTS=100
